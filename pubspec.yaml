name: noor_app
description: Bangla Islamic app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  audioplayers: ^6.1.0
  just_audio: ">=0.9.40 <1.0.0"
  syncfusion_flutter_pdfviewer: ">=28.1.33 <60.0.0"
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  google_sign_in: ^6.2.1
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/quran_bn.json
    - assets/gazal.json
    - assets/audio/
    - assets/avatars/
    - assets/ucharon/
    - assets/dev/
