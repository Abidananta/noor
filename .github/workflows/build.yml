name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android folder repo te rakhte hobe na, build er shomoy toiri hobe
      - name: Generate android platform files
        run: |
          flutter create --platforms=android --project-name noor_app --org com.noor tmp_app
          cp -r tmp_app/android ./android
          rm -rf tmp_app

      # Fixed signing key => the same SHA-1 on every build, which Google
      # Sign-In needs (a fresh random key each run would break login).
      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      # Release builds need this for the AI chat and online gazal
      - name: Add internet permission
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      # In-app update installs the downloaded APK
      - name: Add install-packages permission
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml

      # Let the app open https links and the mail app (Contact us / Update)
      - name: Add package visibility queries
        run: |
          sed -i 's|<queries>|<queries>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n        <intent><action android:name="android.intent.action.SENDTO"/><data android:scheme="mailto"/></intent>\n        <intent><action android:name="android.support.customtabs.action.CustomTabsService"/></intent>|' android/app/src/main/AndroidManifest.xml
          grep -n "mailto" android/app/src/main/AndroidManifest.xml || true

      # Some plugins are compiled against an older Android SDK than their
      # dependencies require; force every module to compileSdk 36.
      - name: Force compileSdk 36 for all modules
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compilesdk.gradle <<'EOF2'
          allprojects {
              afterEvaluate { p ->
                  def ext = p.extensions.findByName('android')
                  if (ext != null) {
                      try {
                          ext.compileSdk = 36
                      } catch (Throwable t) {
                          ext.compileSdkVersion(36)
                      }
                  }
              }
          }
          EOF2

      # Firebase Authentication (login). google-services.json lives in firebase/
      - name: Add Firebase config and Gradle plugin
        run: |
          cp firebase/google-services.json android/app/google-services.json
          sed -i '/id("com.android.application") version/a\    id("com.google.gms.google-services") version "4.5.0" apply false' android/settings.gradle.kts
          sed -i '0,/id("com.android.application")/s//id("com.android.application")\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
          grep -n "google-services" android/settings.gradle.kts android/app/build.gradle.kts
          grep -q "google-services" android/settings.gradle.kts && grep -q "google-services" android/app/build.gradle.kts

      - run: flutter pub get

      # App icon on the home screen / app drawer (assets/icon/*.png)
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # Name shown under the icon + dark launch background (no white flash)
      - name: App name and launch background
        run: |
          sed -i 's|android:label="[^"]*"|android:label="Noor"|' android/app/src/main/AndroidManifest.xml
          for f in $(find android/app/src/main/res -name launch_background.xml); do
            sed -i 's|@android:color/white|#052A21|' "$f"
          done
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      # Android 12+ draws the app icon on its own launch screen before Flutter
      # starts. Make that icon invisible so only the animated splash is seen.
      - name: Hide the system splash icon
        run: |
          RES=android/app/src/main/res
          mkdir -p $RES/values-v31 $RES/values-night-v31
          cat > $RES/values-v31/styles.xml <<'EOF3'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowSplashScreenBackground">#052A21</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>
                  <item name="android:forceDarkAllowed">false</item>
              </style>
          </resources>
          EOF3
          cat > $RES/values-night-v31/styles.xml <<'EOF4'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowSplashScreenBackground">#052A21</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>
                  <item name="android:forceDarkAllowed">false</item>
              </style>
          </resources>
          EOF4
          ls $RES/values-v31 $RES/values-night-v31

      - name: Read app version from pubspec.yaml
        id: ver
        run: |
          FULL=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "short=${FULL%%+*}" >> "$GITHUB_OUTPUT"

      - run: flutter build apk --release --dart-define=APP_VERSION=${{ steps.ver.outputs.full }} --dart-define=UPDATE_REPO=${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: noor-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Same version re-built: remove the old Release and tag first, otherwise
      # replacing the old APK asset fails with "Not Found".
      - name: Remove old release of this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ steps.ver.outputs.short }}" --cleanup-tag --yes --repo "${{ github.repository }}" || true

      # Publishes the APK as a Release (tag v<version>). The app's
      # Settings -> "Update app" reads the latest Release.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.short }}
          name: Noor v${{ steps.ver.outputs.short }}
          files: build/app/outputs/flutter-apk/app-release.apk
