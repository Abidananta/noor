name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android folder repo te rakhte hobe na, build er shomoy toiri hobe
      - name: Generate android platform files
        run: |
          flutter create --platforms=android --project-name noor_app --org com.noor tmp_app
          cp -r tmp_app/android ./android
          rm -rf tmp_app

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: noor-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
